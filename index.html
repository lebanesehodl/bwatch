<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Watch Bitcoin — BWATCH bw–1</title>
<meta name="description" content="BWATCH bw-1. A wristwatch that keeps Bitcoin's time. No app, no account, no custodian.">
<meta property="og:title" content="Watch Bitcoin">
<meta property="og:description" content="BWATCH bw-1. A wristwatch that keeps Bitcoin's time.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://bwatch.xyz">
<meta property="og:image" content="https://bwatch.xyz/img/hero-a.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://bwatch.xyz">
<style>
:root{--paper:#f4f2ec;--ink:#12110d;--dim:#57554e;--rule:#d5d1c5;--orange:#FF3B12}
/* Self-hosted, because a page that says "no custodian" should not phone a
   font CDN to render its own headline. Two weights, latin only, 27 KB. */
@font-face{font-family:"Archivo";src:url("fonts/archivo-600.woff2") format("woff2");
  font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:"Archivo";src:url("fonts/archivo-500.woff2") format("woff2");
  font-weight:500;font-style:normal;font-display:swap}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}   /* the page scrolls now: it is the document */
body{background:var(--paper);color:var(--ink);
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
/* Archivo sets the voice; Helvetica sets the reading. */
h1,h2,h3,.kick,.soon,.cn,.cp,.cl,.sub{
  font-family:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif}
/* the texture belongs to the paper, not to the photograph: it sits below
   the plate, so the image reads as a clean print on a textured page */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.016) 0 1px,transparent 1px 3px)}

.page{position:relative;display:grid;grid-template-columns:minmax(0,0.82fr) minmax(0,1.18fr);
  min-height:100svh;align-items:center}
.txt{padding:clamp(28px,5vh,64px) clamp(20px,3vw,52px);position:relative;z-index:2}
/* The mark, top right. The field is the case: 40.40 x 50.36 with a 5.4
   corner radius, the watch's own proportion. */
.mark{position:absolute;top:clamp(18px,3.2vh,38px);left:clamp(20px,3vw,52px);
  z-index:3;display:block;width:clamp(28px,2.8vw,38px);line-height:0}
.mark svg{display:block;width:100%;height:auto}
/* the page's global link rules add a background and a border on hover —
   on the mark that floods an orange block behind an orange block */
.mark,.mark:hover{background:none;border:0;text-decoration:none}
@media(max-width:960px){
  .mark{top:16px;left:18px;width:30px}
}

.shot{align-self:stretch;min-height:100svh;background-size:cover;
  background-position:50% 46%;background-repeat:no-repeat;position:relative;z-index:1}

.kick{display:flex;align-items:center;gap:10px;font-size:clamp(10.5px,1vw,13px);
  letter-spacing:.22em;font-weight:600;text-transform:uppercase;margin-bottom:14px}
.kick i{display:block;width:clamp(16px,1.6vw,26px);height:3px;background:var(--orange)}
h1{font-size:clamp(44px,7.4vw,112px);font-weight:500;letter-spacing:-.022em;line-height:.9;
  text-transform:uppercase;font-synthesis:none;font-kerning:normal}
h1 span,h1 em{display:block;font-style:normal}
/* Same size, same tracking, flush left. Two attempts at squaring the right
   edge — scaling one line, then tracking it — both depended on which face
   actually loaded, and both broke the moment it was not Archivo. BITCOIN is
   a longer word than WATCH; the ragged edge is the truth of that. */
h1{font-weight:600}
h1 .l1{margin-left:0}
h1 .l2{margin-left:0}
h1 .l3{margin-left:0}
.sub{margin-top:clamp(14px,1.8vh,24px);max-width:none;font-size:clamp(13px,1.24vw,17px);
  font-weight:500;line-height:1.45;text-wrap:balance}
.sub mark{background:var(--orange);color:#fff;padding:.04em .16em .12em;font-weight:400;
  box-decoration-break:clone;-webkit-box-decoration-break:clone}
.soon{display:inline-block;margin-top:clamp(20px,2.8vh,34px);padding:13px 24px;
  border:1px solid var(--ink);background:var(--ink);color:var(--paper);
  font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;font-weight:700}
.hello{margin-top:12px;font-size:12px;letter-spacing:.02em;color:var(--dim);
  line-height:1.5;white-space:nowrap}
.hello a{color:var(--ink);text-decoration:none;
  border-bottom:1px solid var(--orange);padding-bottom:1px}
.hello a:hover{background:var(--orange);color:#fff;border-color:var(--orange)}
.foot{position:fixed;bottom:0;left:0;right:0;z-index:120;
  background:linear-gradient(to top,var(--paper) 60%,transparent);position:fixed;left:0;right:0;bottom:0;z-index:2;display:flex;
  justify-content:space-between;gap:14px;padding:14px clamp(20px,3vw,52px);
  font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--dim);
  border-top:1px solid var(--rule);background:var(--paper)}
.foot a{color:var(--dim);text-decoration:none}
.foot a:hover{color:var(--ink)}
.foot b{color:var(--orange);font-weight:700;font-family:"SF Mono","Courier New",monospace}

@media(max-width:960px){
  .page{grid-template-columns:1fr;min-height:auto}
  .shot{height:46svh;order:-1}
  .txt{padding-bottom:90px}
}


/* ── the document ────────────────────────────────────────────────────
   Everything below the hero. The masthead above is untouched: these rules
   are appended so nothing here can win against it. */
.col{max-width:1180px;margin:0 auto;padding:0 clamp(20px,4vw,52px)}
.col{max-width:none;margin:0;padding:0 clamp(20px,4vw,44px)}
.top{padding-top:clamp(96px,17vh,190px);padding-bottom:clamp(36px,6vh,72px)}
.chead{display:grid;grid-template-columns:auto 1fr;gap:clamp(16px,3vw,36px);
  align-items:start;margin:clamp(56px,9vh,110px) 0 26px;scroll-margin-top:84px;
  padding-top:clamp(28px,4vh,48px);border-top:1px solid var(--rule)}
.chead:first-of-type{border-top:0;padding-top:0}
.cnum{font-family:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  font-weight:800;font-size:clamp(40px,7vw,86px);line-height:.8;
  color:var(--bg);-webkit-text-stroke:2px var(--ink)}
h2{display:block;margin:0;font-size:clamp(26px,4.6vw,58px);font-weight:800;
  letter-spacing:-.03em;line-height:.9;text-transform:uppercase}
h2 i{font-style:normal;color:var(--red);letter-spacing:.3em}
h3{font-size:clamp(24px,3.4vw,44px);font-weight:700;letter-spacing:-.03em;line-height:1.06;
  margin:0 0 22px;text-transform:none}
h3 em{font-style:normal;color:var(--orange)}
dl{margin:0 0 26px;border-top:2px solid var(--ink)}
dl{margin:0 0 18px}
dt{font-family:"SF Mono",ui-monospace,"Courier New",monospace;
  font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--orange);
  font-weight:700;padding:16px 0 0}
dd{margin:0 0 16px;padding:4px 0 16px;border-bottom:1px solid var(--rule);
  color:var(--ink);font-weight:300;max-width:64ch}
.log{counter-reset:f;margin:8px 0 26px}
.log{font-family:"SF Mono","Courier New",monospace;font-size:14px;line-height:1.55;
  border-top:1px solid var(--line)}
.log>div{counter-increment:f;display:grid;grid-template-columns:44px 1fr;
  gap:16px;padding:16px 0;border-top:1px solid var(--rule);align-items:baseline}
.log>div>b{font-family:"SF Mono",ui-monospace,monospace;font-size:13px;
  font-weight:700;color:var(--orange)}
.log>div>span{color:var(--dim);font-weight:300;max-width:62ch}
.log>div>span b{color:var(--ink);font-weight:600}
ul{list-style:none;margin:0 0 26px;padding:0;border-top:2px solid var(--ink)}
li{display:grid;grid-template-columns:64px 1fr;gap:18px;padding:14px 0;
  border-bottom:1px solid var(--rule);align-items:baseline;
  color:var(--dim);font-weight:300}
li>b{font-family:"SF Mono",ui-monospace,monospace;font-size:13px;
  letter-spacing:.12em;color:var(--orange);font-weight:700}
li>span b{color:var(--ink);font-weight:600}
.chead p{margin:14px 0 0;color:var(--dim);font-size:16px;font-weight:300;
  max-width:62ch}
p{margin:0 0 18px;color:var(--dim);font-weight:300;max-width:none}
p b{color:var(--ink);font-weight:400}
p.lead{font-size:clamp(21px,2.6vw,30px);line-height:1.3;color:var(--ink);font-weight:300;
  margin-bottom:24px}
s{color:var(--faint)}
.live{background:var(--orange);color:#fff;padding:2px 9px 3px;
  font-family:"SF Mono",monospace;font-size:.74em;letter-spacing:.06em;white-space:nowrap;
  font-weight:700}
figure{margin:clamp(34px,5vh,60px) 0;max-width:560px}
figure img{display:block;width:100%;height:auto;filter:contrast(1.02) brightness(1.03)}
figure img{cursor:zoom-in}
figcaption{margin-top:12px;font-size:12.5px;color:var(--faint);font-weight:300;max-width:52ch}
figcaption b{color:var(--orange);font-weight:400;font-family:"SF Mono",monospace;
  font-size:11.5px;letter-spacing:.1em}
footer{border-top:1px solid var(--line);margin-top:clamp(70px,11vh,130px);
  padding:34px 0 90px;font-size:12px;color:var(--faint)}
.figpair{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,1.6vw,22px);
  margin:clamp(34px,5vh,60px) 0;max-width:1180px}
.figpair.four{grid-template-columns:repeat(4,1fr);max-width:1460px}
.figpair.two{grid-template-columns:1fr 1fr;max-width:1100px}
.figpair.two img{background:#fff}
.figpair figure{margin:0;max-width:none}
#lb{position:fixed;inset:0;z-index:300;display:none;place-items:center;
  background:rgba(18,17,13,.94);padding:clamp(18px,4vw,56px);cursor:zoom-out}
#lb.on{display:grid}
#lb img{max-width:100%;max-height:82vh;height:auto;display:block;margin:0 auto;
  box-shadow:0 40px 90px rgba(0,0,0,.6)}
#lb .cap{margin:16px auto 0;max-width:56ch;text-align:center;color:#cfccc2;
  font-size:13.5px;line-height:1.45}
#lb .cap b{color:var(--orange);font-family:"SF Mono","Courier New",monospace;
  font-size:12px;letter-spacing:.1em;font-weight:400}
#lb .x{position:fixed;top:18px;right:22px;font-size:11px;letter-spacing:.24em;
  text-transform:uppercase;color:#8d8a80}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:clamp(20px,2.8vh,34px)}
.cta{display:inline-block;padding:13px 22px;background:var(--ink);color:#f4f2ec !important;
  font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;
  text-decoration:none;border:1px solid var(--ink);transition:.16s}
.cta:visited{color:#f4f2ec}
.cta:hover{background:var(--orange);border-color:var(--orange);color:#fff !important}
.cta.ghost{background:transparent;color:var(--ink) !important;border-color:var(--rule)}
.cta.ghost:hover{background:transparent;border-color:var(--ink);color:var(--ink) !important}
.say{margin-top:clamp(14px,1.8vh,24px);font-size:14px;color:var(--dim)}
.say{line-height:1.5}
.instructions{display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;
  margin:26px 0 4px;padding:14px 0;border-top:1px solid var(--rule);
  border-bottom:1px solid var(--rule)}
.instructions span{font-family:"SF Mono",ui-monospace,monospace;font-size:10px;
  letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
.instructions a{font-weight:600;color:var(--ink);text-decoration:none;
  border-bottom:2px solid var(--orange);padding-bottom:1px}
.instructions a:hover{background:var(--orange);color:#fff;border-color:var(--orange)}
mark.hl{background:var(--orange);color:#fff;padding:.04em .16em .12em;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;font-weight:400}
.rv.d1{transition-delay:.13s}
.rv.d2{transition-delay:.26s}
.rv.d3{transition-delay:.39s}
.no-js .rv{opacity:1;transform:none}
.mono{font-family:"SF Mono","Courier New",monospace}
.seg{font-family:'DSEG7',monospace}

/* the page scrolls now, so the hero is one screen and the document follows */
.page{min-height:100svh}
footer{padding:60px 0 90px}


/* ── the narrative ───────────────────────────────────────────────────
   Full-width statements alternating with photographs. One idea per screen,
   nothing to click, and the argument built by scrolling rather than by
   chapter headings. */


/* a photograph on its own, full width */

/* specification */

/* the close */

@media(max-width:820px){
  .pr{grid-template-columns:1fr;gap:26px}
  .pr.flip .prt{order:0}
  .sh img{height:min(56svh,520px)}
}


@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}}

/* ── the list ────────────────────────────────────────────────────────
   A plain form. No script, no embed, no third party loaded on the way in:
   the page stays silent until someone chooses to speak, which is the same
   promise the watch makes. */
.status{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;
  margin-top:clamp(20px,2.8vh,34px)}
.cnt{font-family:"SF Mono",ui-monospace,"Courier New",monospace;font-size:11px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.cnt b{color:var(--orange);font-weight:700}

.wl{display:flex;gap:8px;margin-top:16px;max-width:470px;flex-wrap:wrap}
.wl input[type=text]{flex:1 1 200px;min-width:0;padding:13px 14px;
  border:1px solid var(--ink);background:transparent;color:var(--ink);
  font-family:inherit;font-size:14px;border-radius:0}
.wl input[type=text]::placeholder{color:#9b9689}
.wl input[type=text]:focus{outline:none;border-color:var(--orange);
  box-shadow:inset 0 0 0 1px var(--orange)}
.wl button{padding:13px 20px;border:1px solid var(--ink);background:var(--ink);
  color:var(--paper);font-family:inherit;font-size:10.5px;letter-spacing:.22em;
  text-transform:uppercase;font-weight:700;cursor:pointer;transition:.16s}
.wl button:hover{background:var(--orange);border-color:var(--orange)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);
  white-space:nowrap}

</style>
</head>
<body>

<div class="page">
  <a class="mark" href="/" aria-label="BWATCH">
    <svg viewBox="0 0 40.4 50.36" xmlns="http://www.w3.org/2000/svg" role="img">
      <rect x="0" y="0" width="40.4" height="50.36" rx="5.4" ry="5.4" fill="#FF3B12"/>
      <text x="20.2" y="34.6" text-anchor="middle" fill="#F2EFE6"
            font-family="Archivo,Helvetica,Arial,sans-serif" font-weight="600"
            font-size="36">B</text>
    </svg>
  </a>
  <div class="txt">
    <div class="kick"><i></i>A timechain instrument</div>
    <h1><span class="l1">Watch</span><em class="l2">Bitcoin</em><span class="l3">all day</span></h1>
    <p class="sub"><mark>BWATCH bw&ndash;1</mark>, a wristwatch that keeps<br>
      Bitcoin's time. No app, no account, no custodian.</p>
    <div class="status">
      <span class="soon">Currently in field testing</span>
      <!-- One number, and it only ever falls. A list count was here too, but
           an empty list advertises that nobody is interested yet, and you
           only launch once. Edited by hand when a watch is actually paid for:
           a counter that moved when someone joined a list would be
           manufacturing the scarcity rather than reporting it. -->
      <span class="cnt"><b id="left">21</b> of 21 unclaimed</span>
    </div>

    <form class="wl" action="https://formspree.io/f/xljeaawd" method="POST">
      <label for="e" class="vh">Your email address or Nostr npub</label>
      <input id="e" type="text" name="contact" required
             placeholder="you@example.com  or  npub1&hellip;"
             autocomplete="email" spellcheck="false"
             pattern="(^[^@\s]+@[^@\s]+\.[^@\s]{2,}$)|(^npub1[023456789acdefghjklmnpqrstuvwxyz]{58}$)"
             title="An email address, or an npub beginning npub1">
      <input type="hidden" name="_subject" value="BWATCH bw-1 — Genesis 21 list">
      <input type="hidden" name="_next" value="https://bwatch.xyz/thanks.html">
      <button type="submit">Join the list</button>
    </form>
    <p class="hello">or say <a href="mailto:hello@bwatch.xyz?subject=BWATCH%20bw-1">hello@bwatch.xyz</a></p>
  </div>
  <div class="shot" id="shot" role="img" aria-label="BWATCH bw-1"></div>
</div>


<div class="foot">
  <span><a href="https://btctech.xyz">BTC&nbsp;TECHNOLOGIES</a> / DIV-001</span>
  <span>Block <b id="tip">------</b></span>
</div>

<script>
// One photograph per visit, chosen at random. Not a slideshow: the only thing
// on this page that should move is the block height at the foot, and a second
// moving element would take that away. A repeat visitor gets a different
// image; any single visit still gets one still picture and one live number.
(function(){
  var HEROES = [
    { src:"img/hero-a.jpg", pos:"50% 46%", alt:"BWATCH bw-1 on a sunlit countertop" },
    { src:"img/hero-b.jpg", pos:"50% 52%", alt:"BWATCH bw-1 half covered in sand" },
    { src:"img/hero-c.jpg", pos:"50% 50%", alt:"BWATCH bw-1 among wet pebbles" }
  ];
  var h = HEROES[Math.floor(Math.random() * HEROES.length)];
  var el = document.getElementById("shot");
  el.style.backgroundImage = "url('" + h.src + "')";
  el.style.backgroundPosition = h.pos;
  el.setAttribute("aria-label", h.alt);
})();

(function(){
  function tick(){
    fetch('https://mempool.space/api/blocks/tip/height')
      .then(function(r){return r.text()})
      .then(function(t){var n=parseInt(t,10);
        if(n>0) document.getElementById('tip').textContent=n.toLocaleString();})
      .catch(function(){});
  }
  tick(); setInterval(tick,20000);
})();
</script>
<script>
(function(){
  var h=0;
  function tick(){
    fetch('https://mempool.space/api/blocks/tip/height').then(function(r){return r.text()})
    .then(function(t){var n=parseInt(t,10); if(!(n>h))return; h=n;
      var s=n.toLocaleString();
      ['tip','tip2'].forEach(function(id){var e=document.getElementById(id); if(e)e.textContent=n;});
      var a=document.getElementById('tipa'); if(a)a.textContent=s;
    }).catch(function(){});
  }
  tick(); setInterval(tick,20000);
})();
</script>
