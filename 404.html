<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Not found — BWATCH</title>
<style>
:root{--paper:#f4f2ec;--ink:#12110d;--dim:#57554e;--orange:#FF3B12}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);display:grid;place-items:center;
  font-family:"Neue Haas Grotesk Display Pro","Helvetica Neue",Helvetica,Arial,sans-serif;
  text-align:center;padding:24px}
h1{font-size:clamp(34px,7vw,88px);font-weight:500;letter-spacing:-.035em;text-transform:uppercase}
p{margin-top:16px;color:var(--dim);font-size:15px}
a{color:var(--ink)}
b{color:var(--orange);font-family:"SF Mono","Courier New",monospace;font-weight:700}
</style></head><body><div>
<h1>Orphan block</h1>
<p>That page is not on this chain. <a href="/">Back to the tip</a>.</p>
<p style="margin-top:26px;font-size:11px;letter-spacing:.28em;text-transform:uppercase">
  Block <b id="tip">------</b></p>
</div>
<script>fetch('https://mempool.space/api/blocks/tip/height').then(r=>r.text())
.then(t=>{const n=parseInt(t,10); if(n>0)document.getElementById('tip').textContent=n.toLocaleString()})
.catch(()=>{});</script>
</body></html>
